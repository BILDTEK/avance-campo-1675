function contar() {
  const c = {1:0,2:0,3:0};
  for (const id in estado) if (c[estado[id]] !== undefined) c[estado[id]]++;
  $("#cuenta").textContent = `${c[1]} de ${total} instaladas`;
  $("#b1 small").textContent = c[1]; $("#b2 small").textContent = c[2]; $("#b3 small").textContent = c[3];
}
function chip(p, lista) {
  const el = document.createElement("div");
  el.dataset.id = p.id;
  el.className = "p " + (p.t === "tira" && !lista ? "tira " : "") + claseDe(p.id);
  if (!lista) {
    el.style.left = p.x + "px"; el.style.top = p.y + "px";
    if (p.w) el.style.minWidth = p.w + "px";
    if (p.t === "tira") { el.style.height = p.h + "px"; el.innerHTML = `<span>${p.id}</span>`; }
    else { if (p.h) el.style.height = p.h + "px"; el.textContent = p.id; }
  } else el.textContent = p.id;
  if (lista) el.addEventListener("click", () => marcar(p.id));
  return el;
}
function dibujar() {
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.l === lamina));
  $("#vPlano").classList.toggle("on", vista === "plano"); $("#vLista").classList.toggle("on", vista === "lista");
  $("#plano").style.display = vista === "plano" ? "block" : "none";
  $("#lista").style.display = vista === "lista" ? "block" : "none";
  if (vista === "plano") {
    const lz = $("#lienzo"); lz.innerHTML = "";
    const im = document.createElement("img"); im.src = IMG[lamina]; lz.appendChild(im);
    piezasDe(lamina).forEach(p => lz.appendChild(chip(p, false)));
    ajustar();
  } else {
    const L = $("#lista"); L.innerHTML = "";
    const g = document.createElement("div"); g.className = "g";
    piezasDe(lamina).slice().sort(porNombre).forEach(p => g.appendChild(chip(p, true)));
    L.appendChild(g);
  }
  contar();
}
function porNombre(a, b) {
  const f = s => [s.replace(/\d+$/, ""), parseInt(s.match(/\d+$/)[0], 10)];
  const [la, na] = f(a.id), [lb, nb] = f(b.id);
  return la === lb ? na - nb : la.localeCompare(lb);
}
$("#vPlano").onclick = () => { vista = "plano"; dibujar(); };
$("#vLista").onclick = () => { vista = "lista"; dibujar(); };
[["b1",1],["b2",2],["b3",3],["b0",0]].forEach(([id, v]) => $("#" + id).onclick = () => {
  pincel = v; document.querySelectorAll("#pinceles button").forEach(b => b.classList.toggle("on", b.id === id)); });

// ---- zoom y arrastre del plano
let esc = 1, tx = 0, ty = 0, movio = false;
const W = 1521, H = 1075;
function aplicar() { $("#lienzo").style.transform = `translate(${tx}px,${ty}px) scale(${esc})`; }
function limitar() {
  const r = $("#plano").getBoundingClientRect();
  const w = W * esc, h = H * esc;
  tx = w <= r.width ? (r.width - w) / 2 : Math.min(0, Math.max(r.width - w, tx));
  ty = h <= r.height ? (r.height - h) / 2 : Math.min(0, Math.max(r.height - h, ty));
}
function ajustar() { const r = $("#plano").getBoundingClientRect(); esc = Math.min(r.width / W, r.height / H); limitar(); aplicar(); }
function zoomEn(cx, cy, f) {
  const n = Math.min(3, Math.max(Math.min($("#plano").clientWidth / W, 0.2), esc * f)); f = n / esc;
  tx = cx - (cx - tx) * f; ty = cy - (cy - ty) * f; esc = n; limitar(); aplicar();
}
const ptrs = new Map(); let ult = null, inicio = null;
const area = $("#plano");
area.addEventListener("pointerdown", e => { ptrs.set(e.pointerId, [e.clientX, e.clientY]); if (ptrs.size === 1) { movio = false; inicio = [e.clientX, e.clientY]; } else movio = true; ult = null; });
area.addEventListener("pointermove", e => {
  if (!ptrs.has(e.pointerId)) return;
  const prev = ptrs.get(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  const r = area.getBoundingClientRect();
  if (ptrs.size === 1) {
    if (!movio && Math.hypot(e.clientX - inicio[0], e.clientY - inicio[1]) < 8) return;
    movio = true; tx += e.clientX - prev[0]; ty += e.clientY - prev[1]; limitar(); aplicar();
  } else if (ptrs.size === 2) {
    movio = true;
    const [a, b] = [...ptrs.values()];
    const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    if (ult) zoomEn((a[0] + b[0]) / 2 - r.left, (a[1] + b[1]) / 2 - r.top, d / ult);
    ult = d;
  }
});
const soltar = e => {
  const solo = ptrs.size === 1 && !movio && e.type === "pointerup";
  ptrs.delete(e.pointerId); ult = null;
  if (solo) { const el = document.elementFromPoint(e.clientX, e.clientY); const c = el && el.closest(".p"); if (c) marcar(c.dataset.id); }
  if (!ptrs.size) setTimeout(() => { movio = false; }, 0);
};
area.addEventListener("pointerup", soltar); area.addEventListener("pointercancel", soltar);
area.addEventListener("wheel", e => { e.preventDefault(); const r = area.getBoundingClientRect(); zoomEn(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.15 : 1 / 1.15); }, { passive: false });
$("#zmas").onclick = () => { const r = area.getBoundingClientRect(); zoomEn(r.width / 2, r.height / 2, 1.5); };
$("#zmenos").onclick = () => { const r = area.getBoundingClientRect(); zoomEn(r.width / 2, r.height / 2, 1 / 1.5); };
addEventListener("resize", () => { if (vista === "plano") ajustar(); });

// ---- mensaje
const dosd = n => String(n).padStart(2, "0");
function mensaje() {
  const d = new Date();
  const f = `${d.getFullYear()}-${dosd(d.getMonth() + 1)}-${dosd(d.getDate())} ${dosd(d.getHours())}:${dosd(d.getMinutes())}`;
  const por = {1:[],2:[],3:[]};
  DATOS.piezas.slice().sort(porNombre).forEach(p => { if (por[estado[p.id]]) por[estado[p.id]].push(p.id); });
  let t = `AVANCE ${OBRA} | ${f} | Lagos | v1\n`;
  for (const k of [1, 2, 3]) t += `${NOMBRES[k]} (${por[k].length}): ${por[k].join(" ") || "-"}\n`;
  return t.trim();
}
$("#enviar").onclick = () => {
  $("#msg").textContent = mensaje();
  $("#nota").textContent = "Revise que esté bien y toque Compartir: elija el WhatsApp de Antonio.";
  $("#dlg").showModal();
};
$("#cerrar").onclick = () => $("#dlg").close();
$("#copiar").onclick = async () => {
  try { await navigator.clipboard.writeText($("#msg").textContent); $("#nota").textContent = "Copiado. Péguelo en WhatsApp."; }
  catch (e) { const r = document.createRange(); r.selectNodeContents($("#msg")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); $("#nota").textContent = "Mantenga presionado el texto y copie."; }
};
$("#compartir").onclick = async () => {
  const t = $("#msg").textContent;
  if (navigator.share) { try { await navigator.share({ text: t }); return; } catch (e) { if (e.name === "AbortError") return; } }
  location.href = "https://wa.me/?text=" + encodeURIComponent(t);
};
$("#reiniciar").onclick = () => {
  if (confirm("¿Borrar TODAS las marcas de este teléfono? Sólo hágalo si ya se enviaron.")) { estado = {}; guardar(); dibujar(); }
};
dibujar();
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
